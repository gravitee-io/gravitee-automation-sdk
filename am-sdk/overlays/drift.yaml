overlay: 1.1.0
info:
  title: Tag model fields for drift detection (SDK only, not the mock server)
  version: 0.0.1
actions:
  # Values AM fills in server-side without an OpenAPI default: drift detection must ignore them when unset locally.
  - target: $.components.schemas.AutomationDomain.properties.dataPlaneId
    update:
      x-oapi-codegen-extra-tags:
        drift: ignore-remote-default
  - target: $.components.schemas.SpiffeDomainSettings.properties.defaultAllowedAlgorithms
    update:
      x-oapi-codegen-extra-tags:
        drift: ignore-only:remote

  # Free-form plugin configurations: compared as unstructured objects.
  - target: $.components.schemas.AutomationCertificate.properties.configuration
    update:
      x-oapi-codegen-extra-tags:
        drift: unstructured:masked
  - target: $.components.schemas.AutomationIdentityProvider.properties.configuration
    update:
      x-oapi-codegen-extra-tags:
        drift: unstructured:masked
  - target: $.components.schemas.AutomationReporter.properties.configuration
    update:
      x-oapi-codegen-extra-tags:
        drift: unstructured:masked
  - target: $.components.schemas.AutomationDataPlane.properties.configuration
    update:
      x-oapi-codegen-extra-tags:
        drift: unstructured

  # Read-only properties are set by AM, never part of the desired state: drift detection skips them.
  - target: $.components.schemas.*.properties[?(@.readOnly == true)]
    update:
      x-oapi-codegen-extra-tags:
        drift: ignore

  # AM stores unique arrays as sets, so order carries no meaning: compare them order-insensitively.
  - target: $.components.schemas.*.properties[?(@.uniqueItems == true)]
    update:
      x-oapi-codegen-extra-tags:
        drift: set

  # Array AM defaults to []: absent and empty mean the same thing.
  - target: $.components.schemas.*.properties[?@.type == "array" && length(@.default) == 0]
    update:
      x-oapi-codegen-extra-tags:
        drift: empty-is-nil

overlay: 1.1.0
info:
  title: Shape generated models (drop Automation prefix, map free-form configurations)
  version: 0.0.1
actions:
  - target: $.components.schemas.AutomationAccountSettings
    update:
      x-go-type-name: AccountSettings
  - target: $.components.schemas.AutomationAdvancedSettings
    update:
      x-go-type-name: AdvancedSettings
  - target: $.components.schemas.AutomationApplication
    update:
      x-go-type-name: Application
  - target: $.components.schemas.AutomationApplicationFactorSettings
    update:
      x-go-type-name: ApplicationFactorSettings
  - target: $.components.schemas.AutomationApplicationIdentityProvider
    update:
      x-go-type-name: ApplicationIdentityProvider
  - target: $.components.schemas.AutomationApplicationOAuthSettings
    update:
      x-go-type-name: ApplicationOAuthSettings
  - target: $.components.schemas.AutomationApplicationSAMLSettings
    update:
      x-go-type-name: ApplicationSAMLSettings
  - target: $.components.schemas.AutomationApplicationSettings
    update:
      x-go-type-name: ApplicationSettings
  - target: $.components.schemas.AutomationAssessmentSettings
    update:
      x-go-type-name: AssessmentSettings
  - target: $.components.schemas.AutomationCIBASettings
    update:
      x-go-type-name: CIBASettings
  - target: $.components.schemas.AutomationCertificate
    update:
      x-go-type-name: Certificate
  - target: $.components.schemas.AutomationCertificateSettings
    update:
      x-go-type-name: CertificateSettings
  - target: $.components.schemas.AutomationChallengeSettings
    update:
      x-go-type-name: ChallengeSettings
  - target: $.components.schemas.AutomationClientRegistrationSettings
    update:
      x-go-type-name: ClientRegistrationSettings
  - target: $.components.schemas.AutomationCookieSettings
    update:
      x-go-type-name: CookieSettings
  - target: $.components.schemas.AutomationCrossAppAccessResourceServer
    update:
      x-go-type-name: CrossAppAccessResourceServer
  - target: $.components.schemas.AutomationCrossAppAccessSettings
    update:
      x-go-type-name: CrossAppAccessSettings
  - target: $.components.schemas.AutomationDataPlane
    update:
      x-go-type-name: DataPlane
  - target: $.components.schemas.AutomationDomain
    update:
      x-go-type-name: Domain
  - target: $.components.schemas.AutomationEnrollSettings
    update:
      x-go-type-name: EnrollSettings
  - target: $.components.schemas.AutomationEnrollmentSettings
    update:
      x-go-type-name: EnrollmentSettings
  - target: $.components.schemas.AutomationFactorSettings
    update:
      x-go-type-name: FactorSettings
  - target: $.components.schemas.AutomationIdentityProvider
    update:
      x-go-type-name: IdentityProvider
  - target: $.components.schemas.AutomationMfaSettings
    update:
      x-go-type-name: MfaSettings
  - target: $.components.schemas.AutomationOidcSettings
    update:
      x-go-type-name: OidcSettings
  - target: $.components.schemas.AutomationRememberDeviceSettings
    update:
      x-go-type-name: RememberDeviceSettings
  - target: $.components.schemas.AutomationReporter
    update:
      x-go-type-name: Reporter
  - target: $.components.schemas.AutomationRiskAssessmentSettings
    update:
      x-go-type-name: RiskAssessmentSettings
  - target: $.components.schemas.AutomationSamlAssertionAttribute
    update:
      x-go-type-name: SamlAssertionAttribute
  - target: $.components.schemas.AutomationSamlSettings
    update:
      x-go-type-name: SamlSettings
  - target: $.components.schemas.AutomationScopeSettings
    update:
      x-go-type-name: ScopeSettings
  - target: $.components.schemas.AutomationSessionSettings
    update:
      x-go-type-name: SessionSettings
  - target: $.components.schemas.AutomationStepUpAuthenticationSettings
    update:
      x-go-type-name: StepUpAuthenticationSettings
  - target: $.components.schemas.AutomationTokenClaim
    update:
      x-go-type-name: TokenClaim
  - target: $.components.schemas.AutomationUserInfoClaim
    update:
      x-go-type-name: UserInfoClaim
  - target: $.components.schemas.AutomationWorkloadIdentitySettings
    update:
      x-go-type-name: WorkloadIdentitySettings

  # Enums: type-prefixed constants, so a later enum sharing a value (e.g. "required") can't rename existing constants.
  - target: $.components.schemas.AutomationApplication.properties.kind
    update:
      x-go-type-name: ApplicationKind
      x-enum-varnames: [ApplicationKindUserEmbedded, ApplicationKindHostedDelegated, ApplicationKindAutonomous]
  - target: $.components.schemas.AutomationApplication.properties.type
    update:
      x-go-type-name: ApplicationType
      x-enum-varnames: [ApplicationTypeWeb, ApplicationTypeNative, ApplicationTypeBrowser, ApplicationTypeService, ApplicationTypeResourceServer, ApplicationTypeAgent]
  - target: $.components.schemas.AutomationChallengeSettings.properties.type
    update:
      x-go-type-name: ChallengeSettingsType
      x-enum-varnames: [ChallengeSettingsTypeRequired, ChallengeSettingsTypeConditional, ChallengeSettingsTypeRiskBased]
  - target: $.components.schemas.AutomationEnrollSettings.properties.type
    update:
      x-go-type-name: EnrollSettingsType
      x-enum-varnames: [EnrollSettingsTypeOptional, EnrollSettingsTypeRequired, EnrollSettingsTypeConditional]
  - target: $.components.schemas.AutomationTokenClaim.properties.tokenType
    update:
      x-go-type-name: TokenClaimTokenType
      x-enum-varnames: [TokenClaimTokenTypeAccessToken, TokenClaimTokenTypeRefreshToken, TokenClaimTokenTypeIdToken, TokenClaimTokenTypeIdJag]
  - target: $.components.schemas.AutomationWorkloadIdentitySettings.properties.subjectMatchMode
    update:
      x-go-type-name: WorkloadIdentitySettingsSubjectMatchMode
      x-enum-varnames: [WorkloadIdentitySettingsSubjectMatchModeExact, WorkloadIdentitySettingsSubjectMatchModePrefix]

  # AM computes these per application type when omitted: no default, so WithDefaults leaves them unset.
  - target: $.components.schemas.AutomationApplicationOAuthSettings.properties.forcePKCE.default
    remove: true
  - target: $.components.schemas.AutomationApplicationOAuthSettings.properties.forceS256CodeChallengeMethod.default
    remove: true

  # Free-form plugin configurations: typed as unstructured objects.
  - target: $.components.schemas.AutomationCertificate.properties.configuration
    update:
      x-go-type: unstructured.Stringified
      x-go-type-import:
        path: github.com/gravitee-io/gravitee-automation-sdk/common/pkg/unstructured
  - target: $.components.schemas.AutomationIdentityProvider.properties.configuration
    update:
      x-go-type: unstructured.Stringified
      x-go-type-import:
        path: github.com/gravitee-io/gravitee-automation-sdk/common/pkg/unstructured
  - target: $.components.schemas.AutomationReporter.properties.configuration
    update:
      x-go-type: unstructured.Stringified
      x-go-type-import:
        path: github.com/gravitee-io/gravitee-automation-sdk/common/pkg/unstructured
  - target: $.components.schemas.AutomationDataPlane.properties.configuration
    update:
      x-go-type: unstructured.Unstructured
      x-go-type-import:
        path: github.com/gravitee-io/gravitee-automation-sdk/common/pkg/unstructured

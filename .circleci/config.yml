# Only the AI Management OAS check runs here: the GitHub token that reads the private
# gravitee-gamma-module-aim repository lives in Keeper, which only CircleCI can reach.
# GitHub Actions triggers it (hack/scripts/verify-aim-oas.mjs), as terraform-provider-apim does.
version: 2.1

orbs:
  keeper: gravitee-io/keeper@0.7.0
  gh: circleci/github-cli@2.7.2

parameters:
  trigger:
    type: enum
    default: none
    enum:
      - verify_aim_oas
      - none

jobs:
  verify-aim-oas:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - keeper/env-export:
          secret-url: keeper://TIlcGPFq4rN5GvgnZb9hng/field/password
          var-name: GITHUB_TOKEN
      - gh/setup
      - run:
          name: Verify the AI Management OAS fragment matches its tag
          command: make verify-aim-oas

workflows:
  verify-aim-oas:
    when:
      equal:
        - << pipeline.parameters.trigger >>
        - verify_aim_oas
    jobs:
      - verify-aim-oas:
          name: Verify AI Management OAS matches upstream
          context: cicd-orchestrator

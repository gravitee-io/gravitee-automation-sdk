# Daily OAS check: a CircleCI scheduled trigger (project settings, main, trigger=check_oas)
# runs make check-oas and posts to Slack when it fails (OAS behind upstream, or download error).
version: 2.1

orbs:
  keeper: gravitee-io/keeper@0.7.1
  slack: circleci/slack@6.1.1

parameters:
  trigger:
    type: enum
    default: none
    enum:
      - check_oas
      - none

jobs:
  check-oas:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      # Exported first: steps after a failed one are skipped, the Slack notification is not.
      - keeper/env-export:
          secret-url: keeper://ZOz4db245GNaETVwmPBk8w/field/password
          var-name: SLACK_ACCESS_TOKEN
      - run:
          name: Compare the committed OAS with upstream
          command: make check-oas
      - slack/notify:
          channel: C0CD7HY4PUJ
          event: fail
          branch_pattern: ".+"
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":red_circle: *Automation SDK*: Repository OAS differs from upstream\n*Branch*: ${CIRCLE_BRANCH}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "CircleCI job" },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }

workflows:
  check-oas:
    when:
      equal:
        - << pipeline.parameters.trigger >>
        - check_oas
    jobs:
      - check-oas:
          name: Check OAS matches upstream
          context: cicd-orchestrator

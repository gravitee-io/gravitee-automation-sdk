# An authorization entity: a principal or a resource that policies name.
#   giops authz apply entities -f entity.yaml
#   giops authz get entities example-agents -o yaml
#   giops authz delete entities example-agents   (checks with a dry run, then asks)

hrid: example-agents
# Its id, kind and type are fixed at creation: policies name it Group::"agents".
entityId: agents
kind: PRINCIPAL
entityType: Group
attributes:
  department: travel
# Parent entities in the graph (not giops parents).
parents:
  - entityType: Group
    entityId: travel
# Routing scopes of the PDP gateways that know it.
targets:
  - orders@eu

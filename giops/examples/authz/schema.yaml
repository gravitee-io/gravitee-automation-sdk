# A GAPL schema: the entity and action types the policies of a PDP gateway use.
#   giops authz apply schemas -f schema.yaml
#   giops authz get schemas example-schema -o yaml
#   giops authz delete schemas example-schema

hrid: example-schema
name: Hotel schema
# The routing scope of the PDP gateway of pdp.yaml (targetPdpId@tag), or default.
target: orders@eu
schema: |
  entity User in Group;
  entity Hotel;
  action read appliesTo { principal: User, resource: Hotel };

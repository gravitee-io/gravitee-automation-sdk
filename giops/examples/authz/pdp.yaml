# A PDP gateway: the gateway that runs a PDP engine and answers AuthZEN requests.
#   giops authz apply pdps -f pdp.yaml
#   giops authz get pdps example-pdp -o yaml
#   giops authz delete pdps example-pdp   (checks with a dry run: refused while a policy or entity targets only it)

hrid: example-pdp
name: Orders PDP (EU)
# The PDP engine it runs, and its sharding tag; together, the routing scope orders@eu. Fixed at creation.
targetPdpId: orders
tag: eu
# The AuthZEN endpoint, on the gateway.
endpoint:
  path: /authz/orders-eu

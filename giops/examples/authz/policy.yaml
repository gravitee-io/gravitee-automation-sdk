# An authorization policy, deployed to its PDP gateways on every apply.
#   giops authz apply policies -f policy.yaml
#   giops authz get policies example-policy -o yaml
#   giops authz delete policies example-policy   (checks with a dry run, then asks)

hrid: example-policy
# Its id and type are fixed at creation.
entityId: policy.hotel-booking-read
name: Hotel booking — read access
# MCP, AGENT, MODEL, API or CUSTOM.
policyType: CUSTOM
policyText: permit(principal in Group::"agents", action == Action::"read", resource == Resource::"searchHotels");
# Routing scopes of the PDP gateways that run it.
targets:
  - orders@eu

#   giops apim apply applications -f application.yaml
#   giops apim apply applications -f application.yaml --ignore-groups   (leaves its groups in APIM as they are)
#   giops apim get applications example-app -o yaml
#   giops apim delete applications example-app

# Identifies the application in its environment.
hrid: example-app
name: Example app
description: An application managed with giops

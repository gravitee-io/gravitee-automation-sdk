# An APIM v4 proxy API with one keyless plan.
#   giops apim apply apis -f api.yaml
#   giops apim apply apis -f api.yaml --ignore-groups   (leaves the API's groups in APIM as they are)
#   giops apim get apis example-api -o yaml
#   giops apim delete apis example-api

# Identifies the API in its environment.
hrid: example-api
name: Example API
description: An API managed with giops
type: PROXY
version: "1.0"
# CREATED, PUBLISHED, UNPUBLISHED, DEPRECATED or ARCHIVED: whether the portal shows it.
lifecycleState: PUBLISHED
# STARTED or STOPPED: whether the gateway serves it.
state: STARTED
visibility: PUBLIC
listeners:
  - type: HTTP
    paths:
      - path: /example
    entrypoints:
      - type: http-proxy
endpointGroups:
  - name: default-group
    type: http-proxy
    endpoints:
      - name: default
        type: http-proxy
        configuration:
          target: https://api.gravitee.io/echo
# Plans are identified by their hrid within the API; subscription.yaml subscribes to this one.
plans:
  - hrid: example-plan
    name: Keyless
    status: PUBLISHED
    type: API
    mode: STANDARD
    validation: AUTO
    security:
      type: KEY_LESS

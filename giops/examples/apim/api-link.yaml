# A link in the portal navigation of the API of api.yaml.
#   giops apim apply links -f api-link.yaml
#   giops apim get links example-api-link --api example-api
#   giops apim delete links example-api-link --api example-api

# Hrid of the API the link belongs to. The --api flag overrides it.
api: example-api
hrid: example-api-link
name: Status page
href: https://status.example.com

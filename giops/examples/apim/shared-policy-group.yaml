# An APIM shared policy group: steps that several APIs reuse in a flow phase.
#   giops apim apply shared-policy-groups -f shared-policy-group.yaml
#   giops apim get shared-policy-groups example-spg -o yaml
#   giops apim delete shared-policy-groups example-spg   (checks with a dry run, then asks)

hrid: example-spg
name: Example headers
description: Adds a header to every request
# The API type and the phase the group runs in.
apiType: PROXY
phase: REQUEST
steps:
  - name: Add header
    policy: transform-headers
    enabled: true
    configuration:
      addHeaders:
        - name: X-Example
          value: giops

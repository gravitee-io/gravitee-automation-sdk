# An APIM dictionary: key-value properties that policies read with {#dictionaries['example-dictionary']['key']}.
#   giops apim apply dictionaries -f dictionary.yaml
#   giops apim get dictionaries example-dictionary -o yaml
#   giops apim delete dictionaries example-dictionary

hrid: example-dictionary
name: Example dictionary
# MANUAL (properties below) or DYNAMIC (fetched from a provider).
type: MANUAL
# Deploy it to the gateways.
deployed: true
manual:
  properties:
    backend-url: https://api.gravitee.io/echo
    timeout-ms: "3000"

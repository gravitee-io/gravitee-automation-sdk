# An APIM group.
#   giops apim apply groups -f group.yaml
#   giops apim apply groups -f group.yaml --ignore-members   (leaves the members in APIM as they are)
#   giops apim get groups example-developers -o yaml
#   giops apim delete groups example-developers

# Identifies the group in its environment.
hrid: example-developers
name: Example developers
# Notify the members when the group is applied.
notifyMembers: false
# Role, per scope, of a member who joins the group, including members mapped from an identity provider.
# When declared, it is the whole set: a scope left out loses its default role.
defaultMemberRoles:
  api: USER
  application: USER
  apiProduct: USER
# Members, by identity provider (source) and user id there. Users unknown to that provider are ignored.
members:
  - source: memory
    sourceId: admin
    roles:
      API: OWNER
      APPLICATION: OWNER
      INTEGRATION: USER

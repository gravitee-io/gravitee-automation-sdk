# A subscription of the application of application.yaml to the plan of api.yaml.
# Subscriptions have no dry run: apply says so and asks before applying.
#   giops apim apply subscriptions -f subscription.yaml
#   giops apim get subscriptions example-subscription --api example-api
#   giops apim delete subscriptions example-subscription --api example-api

# Hrid of the API subscribed to. The --api flag overrides it.
api: example-api
hrid: example-subscription
applicationHrid: example-app
# A plan of the API, by its hrid.
planHrid: example-plan

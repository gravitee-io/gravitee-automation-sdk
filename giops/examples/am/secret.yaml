# An AM client secret, for the application of application.yaml.
#   giops am apply secrets -f secret.yaml
#   giops am get secrets --domain example-domain --application example-app
#   giops am delete secrets example-secret --domain example-domain --application example-app
#
# A secret is immutable: to rotate it, apply a secret with a new key, then delete the old one.
# The API never returns the value, so `get secrets -o yaml` cannot be applied back.

# Keys of the domain and the application the secret belongs to. The --domain and --application flags
# override them.
domain: example-domain
application: example-app
# Identifies the secret within its application: lowercase letters, digits and hyphens, at most 64 characters.
key: example-secret
# At least 43 characters. Do not use this one: generate yours from at least 32 random bytes, for example
#   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
value: fake-example-secret-value-generate-your-own-0001

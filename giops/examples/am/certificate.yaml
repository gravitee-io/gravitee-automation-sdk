# An AM certificate, in the domain of domain.yaml: the key that signs the domain's tokens.
#   giops am apply certificates -f certificate.yaml
#   giops am get certificates --domain example-domain
#   giops am delete certificates example-certificate --domain example-domain

# Key of the domain the certificate belongs to. The --domain flag overrides it.
domain: example-domain
# Identifies the certificate within its domain: immutable, lowercase letters, digits and hyphens.
key: example-certificate
name: Example signing certificate
# Plugin type. Its configuration follows the plugin's schema.
type: javakeystore-am-certificate
configuration:
  jks:
    # The keystore file, base64-encoded.
    content: "..."
    name: keystore.jks
  storepass: change-me
  alias: example
  keypass: change-me

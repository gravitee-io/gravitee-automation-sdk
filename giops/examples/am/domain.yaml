# An AM security domain.
#   giops am apply domains -f domain.yaml
#   giops am get domains example-domain -o yaml
#   giops am delete domains example-domain

# Identifies the domain: immutable, lowercase letters, digits and hyphens.
key: example-domain
name: Example domain
description: A security domain managed with giops
# Context path on the AM gateway.
path: /example-domain
enabled: true
# Data plane the domain runs on; resolved from the environment when left out. Immutable.
dataPlaneId: default
# Sharding tags: which gateways deploy the domain.
tags:
  - production
  - external
corsSettings:
  enabled: true
  allowedOrigins:
    - https://app.example.com
  allowedMethods:
    - GET
    - POST
  allowedHeaders:
    - Authorization
    - Content-Type
  allowCredentials: true
  maxAge: 3600
loginSettings:
  forgotPasswordEnabled: true
  registerEnabled: true
  rememberMeEnabled: true
  passwordlessEnabled: false
  identifierFirstEnabled: false
passwordSettings:
  minLength: 12
  maxLength: 128
  includeNumbers: true
  includeSpecialCharacters: true
  lettersInMixedCase: true
  maxConsecutiveLetters: 3
  passwordHistoryEnabled: true
  oldPasswords: 5
accountSettings:
  loginAttemptsDetectionEnabled: true
  maxLoginAttempts: 5
  loginAttemptsResetTime: 600
  accountBlockedDuration: 1800
  sendRecoverAccountEmail: true
scim:
  enabled: true

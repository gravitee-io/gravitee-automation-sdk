# An AM reporter, in the domain of domain.yaml: where the domain's audit events go.
#   giops am apply reporters -f reporter.yaml
#   giops am get reporters --domain example-domain
#   giops am delete reporters example-reporter --domain example-domain

# Key of the domain the reporter belongs to. The --domain flag overrides it.
domain: example-domain
# Identifies the reporter within its domain: immutable, lowercase letters, digits and hyphens.
key: example-reporter
name: Example audit file
# Plugin type. Its configuration follows the plugin's schema.
type: reporter-am-file
enabled: true
configuration:
  filename: example-audit
  outputType: JSON

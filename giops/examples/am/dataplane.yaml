# An AM data plane: the database that holds the runtime data of the domains bound to it.
#   giops am apply dataplanes -f dataplane.yaml --yes   (data planes have no dry run)
#   giops am get dataplanes
#   giops am delete dataplanes example-dataplane

# Identifies the data plane in its environment: a domain's dataPlaneId refers to it.
id: example-dataplane
name: Example data plane
# Plugin type, immutable.
type: mongodb
# Gateway URL of the domains on this data plane.
gatewayUrl: https://gateway.example.com
# Connection settings, write-only: the API never returns them.
configuration:
  mongodb:
    dbname: gravitee-am-example
    host: mongo
    port: 27017

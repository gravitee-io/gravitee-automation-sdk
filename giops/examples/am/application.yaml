# An AM application, in the domain of domain.yaml: an OAuth 2.0 client.
#   giops am apply applications -f application.yaml
#   giops am get applications --domain example-domain
#   giops am delete applications example-app --domain example-domain

# Key of the domain the application belongs to. The --domain flag overrides it.
domain: example-domain
# Identifies the application within its domain: immutable, lowercase letters, digits and hyphens.
key: example-app
name: Example service
description: A machine-to-machine client managed with giops
# web, native, browser, service, resource_server or agent.
type: service
# OAuth 2.0 client id, unique within the domain. Immutable once set.
clientId: example-app-client
enabled: true
# Key of the certificate that signs the application's tokens (certificate.yaml).
certificate: example-certificate
metadata:
  team: example

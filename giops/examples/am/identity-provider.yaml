# An AM identity provider, in the domain of domain.yaml.
#   giops am apply identityproviders -f identity-provider.yaml
#   giops am get identityproviders --domain example-domain
#   giops am delete identityproviders example-users --domain example-domain

# Key of the domain the provider belongs to. The --domain flag overrides it.
domain: example-domain
# Identifies the provider within its domain: immutable, lowercase letters, digits and hyphens.
key: example-users
name: Example users
# Plugin type, immutable. Its configuration follows the plugin's schema.
type: inline-am-idp
configuration:
  users:
    - username: jdoe
      firstname: John
      lastname: Doe
      email: john.doe@example.com
      password: change-me
# Only users with these email domains may sign in.
domainWhitelist:
  - example.com
# User profile attribute <- provider claim.
mappers:
  email: email
  given_name: firstname
  family_name: lastname
# Role or group <- expressions on the user's attributes that grant it.
roleMapper:
  example-admin:
    - "{#profile['email'] == 'john.doe@example.com'}"
groupMapper:
  example-team:
    - "{#profile['email'] matches '.*@example.com'}"

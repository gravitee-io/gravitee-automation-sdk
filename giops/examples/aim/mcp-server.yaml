# An upstream MCP server registered in the AI Catalog. The platform discovers its tools, prompts and resources.
#   giops aim apply mcp-servers -f mcp-server.yaml
#   giops aim get mcp-servers example-mcp-server -o yaml
#   giops aim delete mcp-servers example-mcp-server

hrid: example-mcp-server
# Catalog identity, immutable: lowercase dot-separated segments, the first one mcp-server.
entityId: mcp-server.example
description: Example tools for coding agents
connection:
  endpoint: https://api.githubcopilot.com/mcp/
  # HTTP (streamable HTTP) is the only transport discovery supports.
  transport: HTTP
  auth:
    type: HEADER
    name: Authorization
    # A literal, or a secret:// URI to a configured secret provider. Never returned by the API.
    value: secret://kubernetes/example-mcp:authorization

# An MCP proxy on the gateway, in front of an upstream MCP server, behind an API key plan.
#   giops aim apply mcp-proxies -f mcp-proxy.yaml
#   giops aim get mcp-proxies example-mcp-proxy -o yaml
#   giops aim delete mcp-proxies example-mcp-proxy

hrid: example-mcp-proxy
# Catalog identity, immutable: lowercase dot-separated segments, the first one mcp-proxy.
entityId: mcp-proxy.example
name: Example MCP proxy
# Gateway path agents call.
contextPath: /mcp/example
mode: PROXY
proxy:
  serverUrl: https://api.githubcopilot.com/mcp/
  upstreamAuth:
    type: BEARER
    token: secret://kubernetes/example-mcp:token
plans:
  - name: gold
    security:
      type: API_KEY
      source: HEADER

# A theme of the next-gen developer portal. Applying a theme makes it the environment's active one.
#   giops portal apply themes -f theme.yaml
#   giops portal get themes example-theme -o yaml
#   giops portal delete themes example-theme

hrid: example-theme
name: Example theme
definition:
  font:
    fontFamily: Inter
  color:
    primary: "#1F4E8C"
    secondary: "#F2A900"
    background:
      page: "#FFFFFF"
      card: "#F6F7F9"

# giops reads ./config.yaml, or the file given with -c / --config (.yaml, .yml or .json).
# Declare the modules you use: at least one of am and gamma.
#
# Every value can be set or overridden with an env var, also read from a .env file:
#   GIOPS_AM_BASE_URL, GIOPS_AM_ORG_ID, GIOPS_AM_ENV_ID,
#   GIOPS_AM_AUTH_BEARER_TOKEN, GIOPS_AM_AUTH_BASIC_USERNAME, GIOPS_AM_AUTH_BASIC_PASSWORD,
#   and the same with GIOPS_GAMMA_ (plus GIOPS_GAMMA_CLOUD_TOKEN) for APIM.
# Env vars alone can declare a module that the file leaves out.

# AM: `giops am ...`
am:
  # AM Automation API root, without the organization and environment.
  base_url: http://localhost:8093/automation
  # Organization and environment; DEFAULT when left out.
  org_id: DEFAULT
  env_id: DEFAULT
  # Exactly one of bearer_token and basic_auth.
  auth:
    bearer_token: my-am-token

# APIM: `giops apim ...`
gamma:
  # APIM Automation API root, without the organization and environment.
  base_url: http://localhost:8083/automation
  org_id: DEFAULT
  env_id: DEFAULT
  auth:
    basic_auth:
      username: admin
      password: admin
  # With a Gravitee Cloud token instead, org and env come from the token,
  # and base_url can be left out: it becomes the token's cloud gate.
  # cloud_token: true
  # auth:
  #   bearer_token: <Gravitee Cloud token>

overlay: 1.1.0
info:
  title: Scope org/env on the server URL
  version: 0.0.1
actions:
  - target: $.servers[0]
    description: Bake org/env into the server so operations drop those path params
    update:
      url: "{baseUrl}/organizations/{orgId}/environments/{envId}"
      description: Organization and environment scoped Automation API
      x-go-name: ScopedServerURL
      variables:
        baseUrl:
          default: http://localhost:8083/automation
        orgId:
          default: DEFAULT
        envId:
          default: DEFAULT

  - target: $.paths
    update:
      "/apis": {}
      "/apis/{hrid}": {}
      "/applications": {}
      "/applications/{hrid}": {}
      "/groups": {}
      "/groups/{hrid}": {}
      "/dictionaries": {}
      "/dictionaries/{hrid}": {}
      "/apis/{apiHrid}/subscriptions": {}
      "/apis/{apiHrid}/subscriptions/{hrid}": {}
      "/shared-policy-groups/{hrid}": {}
      "/shared-policy-groups": {}
      "/portals": {}
      "/portals/{hrid}": {}
      "/portals/{portalHrid}/listings": {}
      "/portals/{portalHrid}/listings/{hrid}": {}
      "/portals/{portalHrid}/documentations": {}
      "/portals/{portalHrid}/documentations/{hrid}": {}
      "/portals/{portalHrid}/links": {}
      "/portals/{portalHrid}/links/{hrid}": {}
      "/portal-themes": {}
      "/portal-themes/{hrid}": {}
      "/apis/{apiHrid}/documentations": {}
      "/apis/{apiHrid}/documentations/{hrid}": {}
      "/apis/{apiHrid}/links": {}
      "/apis/{apiHrid}/links/{hrid}": {}
      "/aim/catalog/mcp-servers": {}
      "/aim/catalog/mcp-servers/{hrid}": {}
      "/aim/mcp-proxies": {}
      "/aim/mcp-proxies/{hrid}": {}

  - target: $.paths["/apis"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/apis"]
  - target: $.paths["/apis/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/apis/{hrid}"]
  - target: $.paths["/applications"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/applications"]
  - target: $.paths["/applications/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/applications/{hrid}"]
  - target: $.paths["/groups"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/groups"]
  - target: $.paths["/groups/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/groups/{hrid}"]
  - target: $.paths["/dictionaries"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/dictionaries"]
  - target: $.paths["/dictionaries/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/dictionaries/{hrid}"]
  - target: $.paths["/apis/{apiHrid}/subscriptions"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/subscriptions"]
  - target: $.paths["/apis/{apiHrid}/subscriptions/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/subscriptions/{hrid}"]
  - target: $.paths["/shared-policy-groups/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/shared-policy-groups/{hrid}"]
  - target: $.paths["/shared-policy-groups"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/shared-policy-groups"]
  - target: $.paths["/portals"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portals"]
  - target: $.paths["/portals/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portals/{hrid}"]
  - target: $.paths["/portals/{portalHrid}/listings"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/listings"]
  - target: $.paths["/portals/{portalHrid}/listings/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/listings/{hrid}"]
  - target: $.paths["/portals/{portalHrid}/documentations"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations"]
  - target: $.paths["/portals/{portalHrid}/documentations/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations/{hrid}"]
  - target: $.paths["/portals/{portalHrid}/links"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links"]
  - target: $.paths["/portals/{portalHrid}/links/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links/{hrid}"]
  - target: $.paths["/portal-themes"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portal-themes"]
  - target: $.paths["/portal-themes/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/portal-themes/{hrid}"]
  - target: $.paths["/apis/{apiHrid}/documentations"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations"]
  - target: $.paths["/apis/{apiHrid}/documentations/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations/{hrid}"]
  - target: $.paths["/apis/{apiHrid}/links"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links"]
  - target: $.paths["/apis/{apiHrid}/links/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links/{hrid}"]
  - target: $.paths["/aim/catalog/mcp-servers"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/aim/catalog/mcp-servers"]
  - target: $.paths["/aim/catalog/mcp-servers/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/aim/catalog/mcp-servers/{hrid}"]
  - target: $.paths["/aim/mcp-proxies"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/aim/mcp-proxies"]
  - target: $.paths["/aim/mcp-proxies/{hrid}"]
    copy: $.paths["/organizations/{orgId}/environments/{envId}/aim/mcp-proxies/{hrid}"]

  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/applications"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/applications/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/groups"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/groups/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/dictionaries"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/dictionaries/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/subscriptions"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/subscriptions/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/shared-policy-groups/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/shared-policy-groups"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/listings"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/listings/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portal-themes"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portal-themes/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/aim/catalog/mcp-servers"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/aim/catalog/mcp-servers/{hrid}"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/aim/mcp-proxies"]
    remove: true
  - target: $.paths["/organizations/{orgId}/environments/{envId}/aim/mcp-proxies/{hrid}"]
    remove: true

  # org/env are on the server URL now: drop their parameters, inline or referenced, at path and operation level
  - target: $.paths.*.parameters[?(@['$ref']=='#/components/parameters/orgIdParam')]
    remove: true
  - target: $.paths.*.*.parameters[?(@['$ref']=='#/components/parameters/orgIdParam')]
    remove: true
  - target: $.paths.*.parameters[?(@['$ref']=='#/components/parameters/envIdParam')]
    remove: true
  - target: $.paths.*.*.parameters[?(@['$ref']=='#/components/parameters/envIdParam')]
    remove: true
  - target: $.paths.*.parameters[?(@['$ref']=='#/components/parameters/AimOrgIdParam')]
    remove: true
  - target: $.paths.*.*.parameters[?(@['$ref']=='#/components/parameters/AimOrgIdParam')]
    remove: true
  - target: $.paths.*.parameters[?(@['$ref']=='#/components/parameters/AimEnvIdParam')]
    remove: true
  - target: $.paths.*.*.parameters[?(@['$ref']=='#/components/parameters/AimEnvIdParam')]
    remove: true

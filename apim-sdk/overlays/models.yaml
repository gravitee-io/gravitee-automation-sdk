overlay: 1.1.0
info:
  title: Keep the fields of discriminated subtypes
  version: 0.0.1
actions:
  # The AIM fragment references the base of each discriminated union (type + discriminator.mapping,
  # subtypes extend it with allOf) instead of a oneOf of the subtypes, as the APIM document does for
  # Listener and Selector. oapi-codegen turns such a base into a struct holding `type` only, so every
  # subtype field (an API key source, upstream credentials, provider settings) was dropped on decode.
  # additionalProperties keeps them in the struct's AdditionalProperties map and writes them back.
  - target: $.components.schemas.AimCatalogMcpServerAuth
    update: { additionalProperties: true }
  - target: $.components.schemas.AimMcpProxyUpstreamAuth
    update: { additionalProperties: true }
  - target: $.components.schemas.AimMcpProxyPlanSecurity
    update: { additionalProperties: true }
  - target: $.components.schemas.AimMcpProxyFlowSelector
    update: { additionalProperties: true }
  - target: $.components.schemas.AimMcpProxyIdentityProvider
    update: { additionalProperties: true }

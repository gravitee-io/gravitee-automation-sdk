overlay: 1.1.0
info:
  title: Rename operationIds to get|list|upsert|delete
  version: 0.0.1
actions:
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis"].put
    update:
      operationId: upsertApi
  - target: $.paths["/organizations/{orgId}/environments/{envId}/applications"].put
    update:
      operationId: upsertApplication
  - target: $.paths["/organizations/{orgId}/environments/{envId}/groups"].put
    update:
      operationId: upsertGroup
  - target: $.paths["/organizations/{orgId}/environments/{envId}/dictionaries"].put
    update:
      operationId: upsertDictionary
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/subscriptions"].put
    update:
      operationId: upsertApiSubscription
  - target: $.paths["/organizations/{orgId}/environments/{envId}/shared-policy-groups/{hrid}"].get
    update:
      operationId: getSharedPolicyGroup
  - target: $.paths["/organizations/{orgId}/environments/{envId}/shared-policy-groups/{hrid}"].delete
    update:
      operationId: deleteSharedPolicyGroup
  - target: $.paths["/organizations/{orgId}/environments/{envId}/shared-policy-groups"].put
    update:
      operationId: upsertSharedPolicyGroup
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals"].put
    update:
      operationId: upsertPortal
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/listings"].put
    update:
      operationId: upsertPortalListing
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/documentations"].put
    update:
      operationId: upsertPortalDocumentation
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portals/{portalHrid}/links"].put
    update:
      operationId: upsertPortalLink
  - target: $.paths["/organizations/{orgId}/environments/{envId}/portal-themes"].put
    update:
      operationId: upsertPortalTheme
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/documentations"].put
    update:
      operationId: upsertApiDocumentation
  - target: $.paths["/organizations/{orgId}/environments/{envId}/apis/{apiHrid}/links"].put
    update:
      operationId: upsertApiLink
  - target: $.paths["/organizations/{orgId}/environments/{envId}/aim/catalog/mcp-servers"].put
    update:
      operationId: upsertAimCatalogMcpServer
  - target: $.paths["/organizations/{orgId}/environments/{envId}/aim/mcp-proxies"].put
    update:
      operationId: upsertAimMcpProxy

# Sample mock-server auth. Tokens and passwords are for local use only.
#
#   go run ./am-mock-server --auth-file am-mock-server/examples/auth.yaml
#
# users:
#   admin              — all permissions (empty list)
#   readonly           — LIST + READ on every resource
#   updater            — UPDATE on every resource
#   admin-per-resource — LIST/READ/UPDATE/DELETE listed per resource (not AllPermissions)

users:
  admin:
    password: admin
    token: admin-token
    permissions: []
  readonly:
    password: readonly
    token: readonly-token
    permissions:
      - DOMAIN_LIST
      - DOMAIN_READ
      - DATA_PLANE_LIST
      - DATA_PLANE_READ
      - APPLICATION_LIST
      - APPLICATION_READ
      - DOMAIN_CERTIFICATE_LIST
      - DOMAIN_CERTIFICATE_READ
      - DOMAIN_IDENTITY_PROVIDER_LIST
      - DOMAIN_IDENTITY_PROVIDER_READ
      - DOMAIN_REPORTER_LIST
      - DOMAIN_REPORTER_READ
  updater:
    password: updater
    token: updater-token
    permissions:
      - DOMAIN_UPDATE
      - DATA_PLANE_UPDATE
      - APPLICATION_UPDATE
      - DOMAIN_CERTIFICATE_UPDATE
      - DOMAIN_IDENTITY_PROVIDER_UPDATE
      - DOMAIN_REPORTER_UPDATE
  admin-per-resource:
    password: admin-per-resource
    token: admin-per-resource-token
    permissions:
      - DOMAIN_LIST
      - DOMAIN_READ
      - DOMAIN_UPDATE
      - DOMAIN_DELETE
      - DATA_PLANE_LIST
      - DATA_PLANE_READ
      - DATA_PLANE_UPDATE
      - DATA_PLANE_DELETE
      - APPLICATION_LIST
      - APPLICATION_READ
      - APPLICATION_UPDATE
      - APPLICATION_DELETE
      - DOMAIN_CERTIFICATE_LIST
      - DOMAIN_CERTIFICATE_READ
      - DOMAIN_CERTIFICATE_UPDATE
      - DOMAIN_CERTIFICATE_DELETE
      - DOMAIN_IDENTITY_PROVIDER_LIST
      - DOMAIN_IDENTITY_PROVIDER_READ
      - DOMAIN_IDENTITY_PROVIDER_UPDATE
      - DOMAIN_IDENTITY_PROVIDER_DELETE
      - DOMAIN_REPORTER_LIST
      - DOMAIN_REPORTER_READ
      - DOMAIN_REPORTER_UPDATE
      - DOMAIN_REPORTER_DELETE

permissions:
  - path: /organizations/{orgId}/environments/{envId}/domains
    get: DOMAIN_LIST
    put: DOMAIN_UPDATE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}
    get: DOMAIN_READ
    delete: DOMAIN_DELETE
  - path: /organizations/{orgId}/environments/{envId}/dataplanes
    get: DATA_PLANE_LIST
    put: DATA_PLANE_UPDATE
  - path: /organizations/{orgId}/environments/{envId}/dataplanes/{dataPlaneId}
    get: DATA_PLANE_READ
    delete: DATA_PLANE_DELETE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications
    get: APPLICATION_LIST
    put: APPLICATION_UPDATE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}/applications/{applicationKey}
    get: APPLICATION_READ
    delete: APPLICATION_DELETE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates
    get: DOMAIN_CERTIFICATE_LIST
    put: DOMAIN_CERTIFICATE_UPDATE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}/certificates/{certKey}
    get: DOMAIN_CERTIFICATE_READ
    delete: DOMAIN_CERTIFICATE_DELETE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities
    get: DOMAIN_IDENTITY_PROVIDER_LIST
    put: DOMAIN_IDENTITY_PROVIDER_UPDATE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}/identities/{identityKey}
    get: DOMAIN_IDENTITY_PROVIDER_READ
    delete: DOMAIN_IDENTITY_PROVIDER_DELETE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters
    get: DOMAIN_REPORTER_LIST
    put: DOMAIN_REPORTER_UPDATE
  - path: /organizations/{orgId}/environments/{envId}/domains/{domainKey}/reporters/{reporterKey}
    get: DOMAIN_REPORTER_READ
    delete: DOMAIN_REPORTER_DELETE

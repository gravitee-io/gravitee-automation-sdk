overlay: 1.1.0
info:
  title: Store polymorphic schemas as unstructured objects (mock server only, after the SDK's oneof.yaml)
  version: 0.0.1
actions:
  # The mock only stores and echoes them: a map keeps every variant field, and the generated server
  # does not depend on the SDK's hand-written OneOf* types. OAS validation still runs on the raw request.
  - target: $.components.schemas['Listener','Selector','AimCatalogMcpServerAuth','AimMcpProxyUpstreamAuth','AimMcpProxyPlanSecurity','AimMcpProxyFlowSelector','AimMcpProxyIdentityProvider']
    update:
      x-go-type: unstructured.Unstructured
      x-go-type-import:
        path: github.com/gravitee-io/gravitee-automation-sdk/common/pkg/unstructured

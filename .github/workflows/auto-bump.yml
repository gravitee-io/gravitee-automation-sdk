name: Auto-bump dependents

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]

concurrency:
  group: auto-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Update dependents
        run: |
          BUMPED_SOURCES=""
          DETAILS=""
          for PATTERN in "common/v*" "am-sdk/v*" "apim-sdk/v*"; do
            TAG=$(git tag -l "$PATTERN" --sort=-version:refname | head -1)
            [ -z "$TAG" ] && continue
            COMPONENT="${TAG%%/*}"
            VERSION="${TAG#*/}"
            MODULE="github.com/gravitee-io/gravitee-automation-sdk/${COMPONENT}"
            MAJOR="${VERSION%%.*}"; MAJOR="${MAJOR#v}"
            # Go major versions >= 2 carry a /vN suffix in the module path.
            [ "$MAJOR" -ge 2 ] && MODULE="${MODULE}/v${MAJOR}"
            SOURCE_USED=false
            for mod in am-sdk apim-sdk am-mock-server; do
              [ "$mod" = "$COMPONENT" ] && continue
              if grep -q "$MODULE" "$mod/go.mod"; then
                CURRENT=$(sed -n "s|.*${MODULE} \(v[0-9.]*\).*|\1|p" "$mod/go.mod" | head -1)
                if [ "$CURRENT" != "$VERSION" ]; then
                  (cd "$mod" && go mod edit -require "${MODULE}@${VERSION}" && go mod tidy)
                  DETAILS="${DETAILS}- ${mod}: ${COMPONENT} ${CURRENT} → ${VERSION}\n"
                  SOURCE_USED=true
                fi
              fi
            done
            if [ "$SOURCE_USED" = true ]; then
              [ -n "$BUMPED_SOURCES" ] && BUMPED_SOURCES="${BUMPED_SOURCES}, "
              BUMPED_SOURCES="${BUMPED_SOURCES}${COMPONENT} to ${VERSION}"
            fi
          done

          if [ -n "$DETAILS" ]; then
            echo "HAS_UPDATES=true" >> "$GITHUB_ENV"
            echo "BUMPED_SOURCES=${BUMPED_SOURCES}" >> "$GITHUB_ENV"
            {
              echo "DETAILS<<EOF"
              printf '%b' "$DETAILS"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Create pull request
        id: cpr
        if: env.HAS_UPDATES == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto-bump/deps
          commit-message: |
            fix(deps): bump ${{ env.BUMPED_SOURCES }}

            ${{ env.DETAILS }}
          title: "fix(deps): bump ${{ env.BUMPED_SOURCES }}"
          body: |
            ${{ env.DETAILS }}

            Auto-generated by the auto-bump workflow.

      - name: Run CI on the bump PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref auto-bump/deps

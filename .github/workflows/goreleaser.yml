name: Release Binaries

on:
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        module: [am-mock-server, apim-mock-server]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Find latest ${{ matrix.module }} tag
        id: tag
        run: |
          TAG=$(git tag -l "${{ matrix.module }}/v*" --sort=-version:refname | head -1)
          [ -z "$TAG" ] && echo "found=false" >> "$GITHUB_OUTPUT" && exit 0
          RELEASE=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)
          if [ "$RELEASE" = "false" ] && ! gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.tar\.gz$'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#${{ matrix.module }}/}" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local version tag
        if: steps.tag.outputs.found == 'true'
        run: git tag "${{ steps.tag.outputs.version }}"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.tag.outputs.found == 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: ${{ matrix.module }}
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.version }}

      - name: Upload artifacts to release
        if: steps.tag.outputs.found == 'true'
        run: gh release upload "${{ steps.tag.outputs.tag }}" ${{ matrix.module }}/dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
